
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Photo Gallery</title>

    <link rel="stylesheet" href="Day05.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>My Photo Gallery</h1>

        <p>
            A collection of my favorite photographs
        </p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="gallery-section">

            <h2>My Gallery</h2>

            <div class="gallery">

                <figure class="gallery-item">
                    <img
                        src="images/photo1.jpg"
                        alt="Beautiful landscape"
                    >
                    <figcaption>Beautiful Landscape</figcaption>
                </figure>


                <figure class="gallery-item">
                    <img
                        src="images/photo2.jpg"
                        alt="Nature photography"
                    >
                    <figcaption>Nature</figcaption>
                </figure>


                <figure class="gallery-item">
                    <img
                        src="images/photo3.jpg"
                        alt="City view"
                    >
                    <figcaption>City View</figcaption>
                </figure>


                <figure class="gallery-item">
                    <img
                        src="images/photo4.jpg"
                        alt="Mountain scenery"
                    >
                    <figcaption>Mountains</figcaption>
                </figure>


                <figure class="gallery-item">
                    <img
                        src="images/photo5.jpg"
                        alt="Sunset photography"
                    >
                    <figcaption>Sunset</figcaption>
                </figure>


                <figure class="gallery-item">
                    <img
                        src="images/photo6.jpg"
                        alt="Travel photography"
                    >
                    <figcaption>Travel</figcaption>
                </figure>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            &copy; 2026 Subhash Thakur | Photo Gallery
        </p>

    </footer>

</body>

</html>
