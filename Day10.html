<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <link rel="stylesheet" href="Day10.css">
</head>

<body>

    <main class="todo-container">

        <h1>📝 My To-Do List</h1>

        <p class="subtitle">
            Manage your daily tasks
        </p>


        <!-- Add Task -->

        <div class="input-area">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
            >

            <button id="addButton">
                Add Task
            </button>

        </div>


        <!-- Task Counter -->

        <div class="task-info">

            <p id="taskCount">
                Total Tasks: 0
            </p>

        </div>


        <!-- Task List -->

        <ul id="taskList">
            <!-- Tasks will be added using JavaScript -->
        </ul>

    </main>


    <script src="Day10.js"></script>

</body>

</html>
